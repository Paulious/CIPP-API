name: deploy-backend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest   # switched from windows-latest: codeload.github.com was persistently 429/503-ing action downloads on the Windows runner pool; pwsh + Azure/functions-action work fine on Linux
    environment: test   # rg-cipp-prod doesn't exist yet — switch to "prod" once it's deployed
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and stage modules
        shell: pwsh
        run: ./Tools/Build-DevApiModules.ps1

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          slot-name: Production
          package: '.'
